name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # One leg per platform Hermod is expected to work on:
    #
    #  * Windows, because this is the platform the suite has been verified on
    #    the longest — certificate chain building goes through Schannel and
    #    CryptoAPI here, which behaves differently from OpenSSL. Both the
    #    Ed25519 chain difference and the Mutual-TLS certless-handshake
    #    flakiness were found on this leg.
    #  * Debian 13, because that is what Hermod runs on in production. GitHub
    #    offers no Debian runner image, so this leg runs on an Ubuntu runner
    #    inside a debian:13 container. Deliberately NOT the official .NET SDK
    #    image: that is still Debian-12-based with OpenSSL 3.0, and the
    #    X25519MlKem768 hybrid key exchange needs OpenSSL 3.5+ — on the SDK
    #    image the post-quantum tests could only be skipped, on trixie they
    #    actually run.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, so one leg must not cancel the
    # other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # This repository cannot be built on its own: Hermod.csproj and
      # HermodTests.csproj reference ..\..\Styx\... — a SIBLING directory — and
      # there is no submodule for it. So both repositories are checked out side
      # by side, which reproduces the layout those relative paths assume.
      #
      # Note what this does not do: pin Styx. The HTTP/3 repository pins it
      # through a submodule; here we build against Styx master, so a breaking
      # change there turns this red without anything in Hermod having moved.
      # That is arguably the honest signal, but it is a choice, not an accident.
      - uses: actions/checkout@v7
        with:
          path: Hermod

      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Styx
          path: Styx

      # The bare debian:13 container needs the .NET runtime prerequisites before
      # setup-dotnet installs the SDK: curl for the dotnet-install script itself,
      # ICU and tzdata for globalization, OpenSSL (3.5, which is what makes
      # ML-KEM work) for crypto, ca-certificates for NuGet over HTTPS. Package
      # names verified on Debian 13 (trixie).
      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: Hermod
        run: dotnet build HermodTests/HermodTests.csproj --configuration Release

      # Everything except the live DNS probes — none of these touch the
      # network. They run in-process against our own servers, so a failure
      # means our code broke, not that a resolver was slow.
      #
      # The exclusion is by CATEGORY, not by namespace. It used to be
      # "FullyQualifiedName!~Hermod.Tests.DNS", which threw away all 206 DNS tests
      # because 115 of them query Cloudflare and Google for real — and with them
      # the 91 that do not: cache expiry, zone-file round-trips, wire-format
      # parsing, our own UDP/TCP/TLS DNS servers on ephemeral ports. Those are as
      # deterministic as anything else here and belong in the gate. Only
      # Category("LiveDNS") is left out; nightly.yml runs it non-fatally.
      #
      # This takes ~8 minutes locally and will be slower on a hosted runner. The
      # concurrency group above cancels superseded runs, so a push train does not
      # queue up behind itself.
      - name: Test (everything except live DNS)
        timeout-minutes: 45
        working-directory: Hermod
        run: dotnet test HermodTests/HermodTests.csproj --configuration Release --no-build --filter "TestCategory!=LiveDNS" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # The console log answers "did it pass" and almost nothing else. Finding the single red
      # test in run #59 meant pulling 200 kB of step log and grepping it — and the 45 skips on
      # the Debian leg were not explained there at all, because a skip reason never reaches the
      # console at normal verbosity. TRX keeps both per test: outcome, duration, error message,
      # stack trace and the Assert.Ignore reason. It also survives the run: `gh run download`
      # gets structured results where the log view needs a signed-in browser session.
      #
      # !cancelled() rather than success(): a red run is when these files matter most, so
      # uploading only on green would discard the evidence in exactly that case. A build that
      # fails before the test step leaves no .trx, which upload-artifact reports as a warning
      # rather than a second failure — the compile error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: Hermod/artifacts/*.trx
