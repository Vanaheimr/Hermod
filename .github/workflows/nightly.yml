name: Nightly

# The counterpart to ci.yml. That workflow gates every push and deliberately
# leaves the DNS tests out, because they query Cloudflare and Google for real
# and a gate whose red can also mean "the network was slow" stops being read
# as a gate. Those tests are still worth running — just not against a merge.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 02:17 UTC. Not on the hour: GitHub's scheduler is busiest then and delays
    # runs by tens of minutes.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-suite:
    # The same two-leg matrix as ci.yml: windows-latest, and Debian 13 in a
    # bare debian:13 container. See ci.yml for why it is exactly these two —
    # in short: Schannel/CryptoAPI vs OpenSSL chain building, and the SDK
    # image being Debian-12-based with an OpenSSL too old for ML-KEM.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # Same side-by-side checkout as ci.yml: Hermod.csproj and
      # HermodTests.csproj reference ..\..\Styx\... — a SIBLING directory —
      # and there is no submodule for it.
      - uses: actions/checkout@v7
        with:
          path: Hermod

      - uses: actions/checkout@v7
        with:
          repository: Vanaheimr/Styx
          path: Styx

      # The bare debian:13 container needs the .NET runtime prerequisites before
      # setup-dotnet installs the SDK: curl for the dotnet-install script itself,
      # ICU and tzdata for globalization, OpenSSL (3.5, which is what makes
      # ML-KEM work) for crypto, ca-certificates for NuGet over HTTPS. Package
      # names verified on Debian 13 (trixie).
      - name: Install .NET prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        working-directory: Hermod
        run: dotnet build HermodTests/HermodTests.csproj --configuration Release

      # The same set the gate runs (ci.yml excludes Category "LiveDNS" too, so
      # this is not a wider net any more). Repeating it here is still worth the
      # minutes: it catches tests that only fail sometimes, and — because
      # neither workflow pins Styx — it notices a breaking change in Styx master
      # on a day when nobody pushed to Hermod at all. Fatal: a red here is a
      # real regression.
      - name: Test (everything except live DNS)
        timeout-minutes: 90
        working-directory: Hermod
        run: dotnet test HermodTests/HermodTests.csproj --configuration Release --no-build --filter "TestCategory!=LiveDNS" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # The live DNS probes (Category "LiveDNS"): real queries to Cloudflare,
      # Google and charging.cloud over UDP/TCP/TLS/HTTPS/JSON. Informational on
      # purpose — a hosted runner is not a normal client. The first night this
      # ran, 84 of these 115 failed with IsValid=false while the identical tests
      # passed 206/206 on a residential line: datacentre egress on UDP/53 is
      # restricted and the DoH endpoints rate-limit these IPs. Failures here
      # mean "the runner could not ask", which says nothing about our resolver,
      # so they must not be able to turn the night red. Read the numbers below
      # for a trend instead; a sudden 115/115 failure IS worth investigating.
      - name: Live DNS probes (informational)
        continue-on-error: true
        timeout-minutes: 30
        working-directory: Hermod
        shell: bash
        run: |
          set +e
          dotnet test HermodTests/HermodTests.csproj --configuration Release --no-build \
            --filter "TestCategory=LiveDNS" --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=${{ matrix.leg }}-livedns.trx" --results-directory artifacts 2>&1 | tee livedns.txt
          {
            echo '## Live DNS probes (informational, ${{ runner.os }})'
            echo
            echo 'Network-dependent: failures here reflect runner egress, not our resolver.'
            echo
            echo '```'
            grep -E "Passed!|Failed!|Total tests|Passed:|Failed:" livedns.txt || tail -5 livedns.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Two .trx files per leg: the gated set and the live probes. The step summary
      # above reduces the probes to five counters, which is the right amount to read
      # every morning but the wrong amount when a night looks odd — it cannot say
      # WHICH of the 115 failed, so "84 failed" and "84 different ones failed" are
      # indistinguishable across two nights. The probe .trx names them, and keeping
      # it makes the trend the comment above asks for actually checkable.
      #
      # continue-on-error on the probe step means it counts as successful here, so
      # !cancelled() collects both files even on a night the live probes went red.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: Hermod/artifacts/*.trx
